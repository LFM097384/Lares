# iOS 云端构建(GitHub Actions macOS runner,无需本地 Mac)
# 触发:手动 workflow_dispatch;或打 tag(v*)。
# 产物:未签名 .ipa(模拟器/开发侧载用)——上架/TestFlight 签名见 deploy/ios-ci.md
name: Platform Builds

on:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: '签名并上传到 TestFlight(需先配好 ASC_* Secrets)'
        type: boolean
        default: false
  push:
    tags: ['v*']

jobs:
  # ⚠️ 这个 job 存在的理由,是一次真实事故。
  #
  # 2026-09-12 联调时把仓库变量 LARES_SIGNALING 设成了局域网地址
  # `ws://10.0.0.185:8787`,之后**所有**构建(包括发给 TestFlight 的)
  # 都被编译成连那个地址。手机上永远连不通,界面停在「正在进去…」,
  # 而服务端日志里干干净净 —— 因为请求根本没到过服务器。
  #
  # 整整十天、十几个构建、三轮状态机重构都没找到原因,因为那些代码
  # **根本没机会执行**:连接压根没建立。
  #
  # 教训:发布构建里出现 127.0.0.1 / 局域网 IP / ws:// 明文,
  # 都是配置错误而不是「本地调试的默认值」。在编译前就拦下来。
  guard-config:
    runs-on: ubuntu-latest
    steps:
      - name: 校验信令地址
        env:
          URL: ${{ vars.LARES_SIGNALING }}
        run: |
          set -euo pipefail
          if [ -z "$URL" ]; then
            echo "::warning::未设 vars.LARES_SIGNALING,将使用 workflow 里的生产回落值"
            exit 0
          fi
          echo "vars.LARES_SIGNALING = $URL"

          # 局域网 / 本机地址:发布构建里出现就是事故
          case "$URL" in
            *127.0.0.1*|*localhost*|*10.*|*192.168.*|*172.1[6-9].*|*172.2[0-9].*|*172.3[01].*)
              echo "::error::信令地址是局域网/本机地址($URL)。发布构建连不上它,界面会永久停在「正在进去…」,而服务端日志里看不到任何痕迹。请把 vars.LARES_SIGNALING 改回生产地址。"
              exit 1
              ;;
          esac

          # 明文 ws:// 在 iOS 上会被 ATS 拦掉(除非是本地网络)
          case "$URL" in
            ws://*)
              echo "::error::信令地址用了明文 ws://($URL)。iOS 的 App Transport Security 会拦截,必须用 wss://。"
              exit 1
              ;;
          esac

          echo "✓ 信令地址看起来是生产地址"

  build-ios:
    needs: guard-config
    runs-on: macos-26
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      # 程序化接入 LaresWidget(WidgetKit)target(幂等)
      - name: Add LaresWidget target
        run: |
          gem install xcodeproj --no-document
          ruby ios/add_widget_target.rb

      # macOS 上插件链接用真 symlink,无需 Windows 的 Junction 脚本
      - name: Build iOS (unsigned)
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=LARES_SIGNALING=${{ vars.LARES_SIGNALING || 'wss://lares.westus.cloudapp.azure.com:443/ws' }}

      - name: Package .ipa
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -qry lares_app.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: lares-ios-unsigned
          path: app/build/ios/iphoneos/lares_app.ipa
          retention-days: 14

  # ── TestFlight:已签名构建 + 上传 ────────────────────────────────────────
  # 与上面的 build-ios 并存,分工不同:
  #   build-ios        未签名 .ipa —— 侧载、Release 资产、自动更新用
  #   testflight       已签名 .ipa —— 装进真机、提交 App Store 用
  #
  # 只在手动触发且勾选 upload_testflight 时运行 —— 每次上传都会占用一个
  # build number,误触会浪费号段,也会在 ASC 里堆垃圾构建。
  #
  # 需要的 Secrets(仓库 Settings → Secrets and variables → Actions):
  #   ASC_KEY_ID        App Store Connect API 密钥 ID(10 位)
  #   ASC_ISSUER_ID     Issuer ID(UUID,整个团队一个)
  #   ASC_PRIVATE_KEY   .p8 文件的**完整文本**(含 BEGIN/END 行)
  #   APPLE_TEAM_ID     10 位 Team ID
  # 配置步骤见 deploy/ios-ci.md。
  testflight:
    needs: guard-config
    if: github.event_name == 'workflow_dispatch' && inputs.upload_testflight
    runs-on: macos-26
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      # ⚠️ 必须在「Add LaresWidget target」**之前** ——
      # 脚本要拿这个号写进 Widget 的 CFBundleVersion,
      # 两边版本号对不上会触发 ITMS-90473,详见下面那一步的注释。
      - name: 计算 build number
        id: ver
        run: |
          BASE=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1)
          echo "name=$BASE"                     >> "$GITHUB_OUTPUT"
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "→ $BASE (build ${{ github.run_number }})"

      # ⚠️ 这里注入的版本号必须与主 App 完全一致。
      # 不一致时 ASC 报 ITMS-90473,而那只是个 **warning** ——
      # 上传显示成功、构建却永远不出现在 TestFlight 里,极难定位。
      # 2026-09-19 实测踩过:Widget 停在 pubspec 的 +2、主 App 是 run_number 21。
      - name: Add LaresWidget target
        env:
          LARES_BUILD_NAME: ${{ steps.ver.outputs.name }}
          LARES_BUILD_NUMBER: ${{ steps.ver.outputs.build }}
        run: |
          gem install xcodeproj --no-document
          ruby ios/add_widget_target.rb

      # API 密钥落到 altool / xcodebuild 都会去找的标准位置。
      # altool 按固定顺序搜 AuthKey_<keyId>.p8,~/.appstoreconnect/private_keys
      # 是其中最规范的一个;xcodebuild 则用 -authenticationKeyPath 显式指定。
      - name: 安装 App Store Connect API 密钥
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_PRIVATE_KEY" ]; then
            echo "::error::缺少 ASC_KEY_ID / ASC_PRIVATE_KEY,见 deploy/ios-ci.md"
            exit 1
          fi
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          # 只验证格式,绝不打印内容
          head -1 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            | grep -q 'BEGIN PRIVATE KEY' \
            || { echo "::error::.p8 格式不对:应以 -----BEGIN PRIVATE KEY----- 开头。检查 Secret 是否粘贴完整(含首尾两行)。"; exit 1; }

      # ⚠️ 必须在签名之前跑。
      #
      # `-allowProvisioningUpdates` 每次找不到可用证书就**新建一个**,
      # 而 Apple 的开发证书有数量上限(实测 12)。攒满之后构建直接失败:
      #   error: Choose a certificate to revoke. Your account has reached
      #          the maximum number of certificates.
      #   error: No profiles for 'com.lfm097384.lares' were found
      # 第二条极具误导性 —— 看着是描述文件问题,根因却是第一条。
      # 2026-09-21 实测撞到:12 个全是 CI 造的 "Created via API"。
      #
      # 脚本只吊销 CI 自己造的**开发**证书,不碰分发证书,
      # 也不影响任何已上传/已发布的构建(它们归档时就签好了)。
      - name: 清理陈旧的 CI 开发证书
        continue-on-error: true # 清理失败不该挡住构建;真满了下一步会报出来
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          WORK=$(mktemp -d)
          cd "$WORK"
          echo '{"type":"module"}' > package.json
          npm install jsonwebtoken --silent
          cp "$GITHUB_WORKSPACE/scripts/asc-prune-certs.mjs" .
          node asc-prune-certs.mjs

      # 自动签名:xcodebuild 拿 API 密钥自己去 ASC 创建/下载证书和描述文件。
      # 这样就不必在 Windows 上折腾 CSR → p12 → mobileprovision,
      # 证书过期也不用管。
      - name: 构建已签名 .ipa
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          # 先让 Flutter 生成 Xcode 工程与 Generated.xcconfig,
          # 但不让它自己打包 —— flutter build ipa 在
          # path_provider_foundation 2.6.0 下会漏掉 Runner.app(flutter#187752)。
          # 我们已用 dependency_overrides 钉回 2.5.1,这里仍走
          # xcodebuild archive + exportArchive 的标准路径:多一层保险,
          # 且导出选项完全可控。
          flutter build ios --release --no-codesign \
            --build-name=${{ steps.ver.outputs.name }} \
            --build-number=${{ steps.ver.outputs.build }} \
            --dart-define=LARES_SIGNALING=${{ vars.LARES_SIGNALING || 'wss://lares.westus.cloudapp.azure.com:443/ws' }}

          KEY=~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Runner.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            archive

          # method 必须是 app-store-connect;旧的 app-store 已弃用
          cat > /tmp/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>stripSwiftSymbols</key><true/>
            <!-- false:用我们上面算好的 build number,别让 Xcode 擅自改 -->
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath build/Runner.xcarchive \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

          ls -lh build/export/

      # 结构自检:flutter#187752 的症状就是 Payload/ 下没有 .app。
      # 这个 bug 在上传前毫无征兆,只有 altool 报一句指不到原因的
      # FailedToExpandPackage。与其到那时再猜,不如在这里直接拆开看。
      - name: 校验 .ipa 结构
        run: |
          set -euo pipefail
          IPA=$(ls build/export/*.ipa | head -1)
          echo "检查 $IPA"
          unzip -l "$IPA" | head -20
          if ! unzip -l "$IPA" | grep -qE 'Payload/[^/]+\.app/'; then
            echo "::error::.ipa 里的 Payload/ 下没有 .app —— 疑似 flutter#187752。检查 pubspec.yaml 的 dependency_overrides 是否仍钉着 path_provider_foundation 2.5.1。"
            exit 1
          fi
          echo "✓ Payload/*.app 存在"

          # 扩展与主 App 的 CFBundleVersion 必须完全一致。
          # 不一致时 ASC 只报一个 **warning**(ITMS-90473),上传照样成功,
          # 但构建会被判为无效、永远不出现在 TestFlight 里 —— 没有任何报错。
          # 2026-09-19 实测踩过一次,所以在这里主动拦下来。
          WORK=$(mktemp -d)
          unzip -q "$IPA" -d "$WORK"
          APP=$(ls -d "$WORK"/Payload/*.app | head -1)
          APP_VER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
          echo "主 App CFBundleVersion = $APP_VER"
          FAILED=0
          for ext in "$APP"/PlugIns/*.appex; do
            [ -e "$ext" ] || continue
            EXT_VER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$ext/Info.plist")
            NAME=$(basename "$ext")
            if [ "$EXT_VER" != "$APP_VER" ]; then
              echo "::error::$NAME 的 CFBundleVersion 是 $EXT_VER,与主 App 的 $APP_VER 不一致(ITMS-90473)。构建会上传成功但永远不出现在 TestFlight。检查 ios/add_widget_target.rb 是否收到了 LARES_BUILD_NUMBER。"
              FAILED=1
            else
              echo "✓ $NAME = $EXT_VER"
            fi
          done
          rm -rf "$WORK"
          [ $FAILED -eq 0 ] || exit 1

      # 先 validate 再 upload:validate 免费且快,能提前抓出签名、
      # 权限、隐私清单一类问题,省掉一次漫长的上传。
      - name: 预检(altool validate)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA=$(ls build/export/*.ipa | head -1)
          set +e
          OUT=$(xcrun altool --validate-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" \
            --output-format json 2>/tmp/val.err)
          CODE=$?
          set -e
          echo "$OUT"
          # altool 有个坑:有时 exit 0 但 JSON 里带着 product-errors
          if echo "$OUT" | grep -q '"product-errors"'; then
            echo "::error::预检未通过,详见上面的 product-errors"
            cat /tmp/val.err || true
            exit 1
          fi
          [ $CODE -eq 0 ] || { cat /tmp/val.err; exit $CODE; }

      - name: 上传到 TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA=$(ls build/export/*.ipa | head -1)
          set +e
          OUT=$(xcrun altool --upload-package "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" \
            --output-format json 2>/tmp/up.err)
          CODE=$?
          set -e
          echo "$OUT"
          if echo "$OUT" | grep -q '"product-errors"'; then
            echo "::error::上传被拒,详见上面的 product-errors"
            cat /tmp/up.err || true
            exit 1
          fi
          [ $CODE -eq 0 ] || { cat /tmp/up.err; exit $CODE; }
          echo "✓ 字节已送达 Apple。但这**不等于**构建可用 —— 见下一步。"

      # ⚠️ 这一步是这个 workflow 里最重要的检查,不要删。
      #
      # altool **只报送达,不报处理结果**。2026-09-19 实测:连续两次
      # "No errors uploading"、有 delivery-uuid、32MB 确实传到了 Apple,
      # 但构建**从未出现**在 TestFlight,没有任何邮件或界面提示。
      # 真正的原因(ITMS-90683 缺 NSCameraUsageDescription)只存在于
      # REST API 的 GET /v1/buildUploads/<id> 的 state.errors 里。
      #
      # 教训:altool 的成功只说明字节到了,处理阶段的失败它一概不知。
      # 所以这里轮询 ASC,拿到 VALID 才算真成功。
      - name: 确认 ASC 处理结果
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUILD_NUMBER: ${{ steps.ver.outputs.build }}
          # 不传 ASC_P8:脚本默认去 $HOME/.appstoreconnect/private_keys/
          # 找 AuthKey_<KEY_ID>.p8,正是上一步「安装 ASC API 密钥」放的位置。
        # 脚本放在 scripts/ 而不是内联 heredoc。
        # 2026-09-19 用 heredoc 写过一版,结束标记被缩进了(`<<'JS'` 不带 `-`
        # 要求标记顶格),整个 cat 吞掉后面所有内容,步骤在执行前就崩,
        # 而且日志里一个字都没有、步骤名显示成 UNKNOWN STEP —— 极难定位。
        # 独立文件还能在本地跑,不必拿 CI 当测试环境。
        run: |
          set -euo pipefail
          WORK=$(mktemp -d)
          cd "$WORK"
          echo '{"type":"module"}' > package.json
          npm install jsonwebtoken --silent
          cp "$GITHUB_WORKSPACE/scripts/asc-wait-build.mjs" .
          node asc-wait-build.mjs

      # 留一份签名产物便于排查(不含密钥)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lares-ios-signed
          path: app/build/export/
          retention-days: 7

  # macOS 桌面端顺带构建(同一 runner,产物 .app)
  build-macos:
    needs: guard-config
    runs-on: macos-26
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true
      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop
      - name: Pub get
        run: flutter pub get
      - name: Build macOS
        run: |
          flutter build macos --release \
            --dart-define=LARES_SIGNALING=${{ vars.LARES_SIGNALING || 'wss://lares.westus.cloudapp.azure.com:443/ws' }}
      - name: Package .app
        run: |
          cd build/macos/Build/Products/Release
          zip -qry lares-macos.zip lares_app.app
      - uses: actions/upload-artifact@v4
        with:
          name: lares-macos
          path: app/build/macos/Build/Products/Release/lares-macos.zip
          retention-days: 14

  build-android:
    needs: guard-config
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Build APK (split per ABI)
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=LARES_SIGNALING=${{ vars.LARES_SIGNALING || 'wss://lares.westus.cloudapp.azure.com:443/ws' }}
      - uses: actions/upload-artifact@v4
        with:
          name: lares-android-apk
          path: app/build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 14

  build-windows:
    needs: guard-config
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release --verbose --dart-define=LARES_SIGNALING=${{ vars.LARES_SIGNALING || 'wss://lares.westus.cloudapp.azure.com:443/ws' }}
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\dist | Out-Null
          Copy-Item assets\tray build\windows\x64\runner\Release\assets\tray -Recurse -Force
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\dist\lares-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: lares-windows
          path: app/build/dist/lares-windows.zip
          retention-days: 14

  # ── 发布 Release 资产(需求⑦ 自动更新的前提)────────────────────────────
  # ⚠️ 为什么必须有这个 job:上面四个 upload-artifact 产出的是 Actions
  #    **artifact**,不是 Release **asset** —— 它们 14 天过期、且下载需要鉴权。
  #    v0.1.0 的 API 实测 "assets": [],应用内更新根本无从下载。
  #    没有这一步,自动更新功能是永久失效的。
  #
  # SHA256SUMS.txt 的内容会写进 release body:客户端的校验和解析器认得
  # `sha256sum` 的标准输出格式,据此把完整性等级从「仅长度」提升到
  # 「长度 + 已公布 SHA-256」。GitHub 的 asset JSON 本身不含任何校验和字段。
  publish-release:
    needs: [build-ios, build-macos, build-android, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: 汇总产物并算校验和
        run: |
          mkdir -p out
          find dist -type f \( -name '*.zip' -o -name '*.apk' -o -name '*.ipa' \) \
            -exec cp {} out/ \;
          cd out
          sha256sum * > SHA256SUMS.txt
          echo "=== 将发布的资产 ==="
          ls -lh
          cat SHA256SUMS.txt
      - name: 生成 release 正文(含校验和)
        run: |
          {
            echo "## 校验和(SHA-256)"
            echo
            echo '```'
            cat out/SHA256SUMS.txt
            echo '```'
            echo
            echo "> 应用内更新会自动比对这些校验和。"
          } > RELEASE_BODY.md
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body_path: RELEASE_BODY.md
          append_body: true
