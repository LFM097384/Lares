# iOS 云端构建(GitHub Actions macOS runner,无需本地 Mac)
# 触发:手动 workflow_dispatch;或打 tag(v*)。
# 产物:未签名 .ipa(模拟器/开发侧载用)——上架/TestFlight 签名见 deploy/ios-ci.md
name: Platform Builds

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build-ios:
    runs-on: macos-26
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      # 程序化接入 LaresWidget(WidgetKit)target(幂等)
      - name: Add LaresWidget target
        run: |
          gem install xcodeproj --no-document
          ruby ios/add_widget_target.rb

      # macOS 上插件链接用真 symlink,无需 Windows 的 Junction 脚本
      - name: Build iOS (unsigned)
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=LARES_SIGNALING=${{ vars.LARES_SIGNALING || 'wss://127.0.0.1:8787' }}

      - name: Package .ipa
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -qry lares_app.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: lares-ios-unsigned
          path: app/build/ios/iphoneos/lares_app.ipa
          retention-days: 14

  # macOS 桌面端顺带构建(同一 runner,产物 .app)
  build-macos:
    runs-on: macos-26
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true
      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop
      - name: Pub get
        run: flutter pub get
      - name: Build macOS
        run: |
          flutter build macos --release \
            --dart-define=LARES_SIGNALING=${{ vars.LARES_SIGNALING || 'wss://127.0.0.1:8787' }}
      - name: Package .app
        run: |
          cd build/macos/Build/Products/Release
          zip -qry lares-macos.zip lares_app.app
      - uses: actions/upload-artifact@v4
        with:
          name: lares-macos
          path: app/build/macos/Build/Products/Release/lares-macos.zip
          retention-days: 14

  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Build APK (split per ABI)
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=LARES_SIGNALING=${{ vars.LARES_SIGNALING || 'wss://127.0.0.1:8787' }}
      - uses: actions/upload-artifact@v4
        with:
          name: lares-android-apk
          path: app/build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 14

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release --verbose --dart-define=LARES_SIGNALING=${{ vars.LARES_SIGNALING || 'wss://127.0.0.1:8787' }}
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\dist | Out-Null
          Copy-Item assets\tray build\windows\x64\runner\Release\assets\tray -Recurse -Force
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\dist\lares-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: lares-windows
          path: app/build/dist/lares-windows.zip
          retention-days: 14

  # ── 发布 Release 资产(需求⑦ 自动更新的前提)────────────────────────────
  # ⚠️ 为什么必须有这个 job:上面四个 upload-artifact 产出的是 Actions
  #    **artifact**,不是 Release **asset** —— 它们 14 天过期、且下载需要鉴权。
  #    v0.1.0 的 API 实测 "assets": [],应用内更新根本无从下载。
  #    没有这一步,自动更新功能是永久失效的。
  #
  # SHA256SUMS.txt 的内容会写进 release body:客户端的校验和解析器认得
  # `sha256sum` 的标准输出格式,据此把完整性等级从「仅长度」提升到
  # 「长度 + 已公布 SHA-256」。GitHub 的 asset JSON 本身不含任何校验和字段。
  publish-release:
    needs: [build-ios, build-macos, build-android, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: 汇总产物并算校验和
        run: |
          mkdir -p out
          find dist -type f \( -name '*.zip' -o -name '*.apk' -o -name '*.ipa' \) \
            -exec cp {} out/ \;
          cd out
          sha256sum * > SHA256SUMS.txt
          echo "=== 将发布的资产 ==="
          ls -lh
          cat SHA256SUMS.txt
      - name: 生成 release 正文(含校验和)
        run: |
          {
            echo "## 校验和(SHA-256)"
            echo
            echo '```'
            cat out/SHA256SUMS.txt
            echo '```'
            echo
            echo "> 应用内更新会自动比对这些校验和。"
          } > RELEASE_BODY.md
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body_path: RELEASE_BODY.md
          append_body: true
