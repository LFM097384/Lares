# ──────────────────────────────────────────────────────────────────────────────
# Lares 炉灵 — 端口安全版全栈 compose
#
# ⚠️ 这台 VPS 同时在跑机场(xray / 3x-ui):443、8443、9721、2096/tcp 与 3443/udp
#    已被占用,**绝对不能碰**。本文件所有端口都刻意避开了它们。
#
#    历史版本把 Caddy 映射到 "80:80" 和 "443:443" —— 那会直接抢走 Reality 入站,
#    机场当场失联。现在 Caddy 只发布 ${LARES_HTTPS_PORT}(默认 8444)。
#
# ⚠️⚠️ 关于 ACME 的一个「反直觉」事实(已核对 Caddy 源码 autohttps.go):
#    把站点写成 `example.com:8444` **并不会**让 Caddy 只用 8444 做验证。
#    Caddy 仍会尝试公共 ACME,且 **TLS-ALPN-01 不会因为端口非 443 而自动关闭** ——
#    它会另外去监听 :443,HTTP-01 会去监听 :80。在这台机器上那正是灾难。
#    只有 **DNS-01 会关闭其它 challenge**。所以默认模式必须是 dns,
#    file / selfsigned 模式则显式 `auto_https off`。见 caddy/Caddyfile.* 里的说明。
#    (容器有独立 netns,未发布的端口不会真的占用宿主 443;但验证会失败,
#     所以「能签下证书」这件事本身就要求 DNS-01。双重保险。)
#
# 用法:
#   cp .env.example .env && vim .env      # 填域名/密钥/鉴权
#   ./preflight.sh                        # 只读体检,必须先过
#   ./deploy.sh                           # 部署 + 自检 + 机场存活复检
#
# 要求 docker compose ≥ v2.23.1(configs 的内联 content: 从该版本才支持)
# ──────────────────────────────────────────────────────────────────────────────
name: lares

# ⚠️ Docker 发布端口会绕过 UFW(DNAT 发生在 DOCKER 链,先于 ufw 的 INPUT 规则)。
#    下面 ports: 里出现的端口一律直接对公网开放,`ufw deny` 拦不住。
#    这是 Docker 的既有行为,不是本文件的 bug —— 详见 README「防火墙」一节。

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m" # 20GB 磁盘,别让日志吃光
    max-file: "3"

services:
  # ── LiveKit SFU:只承载音频 ────────────────────────────────────────────────
  livekit:
    image: livekit/livekit-server:v1.13.6
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    configs:
      - source: livekit_config
        target: /etc/livekit.yaml
    ports:
      # 宿主端口必须与容器端口一致:LiveKit 会把端口号写进 ICE candidate,
      # 一旦做端口转换,客户端拿到的候选地址就是错的,媒体必定连不通。
      - "${LARES_RTC_TCP_PORT:-7881}:${LARES_RTC_TCP_PORT:-7881}/tcp"
      - "${LARES_RTC_UDP_PORT:-7882}:${LARES_RTC_UDP_PORT:-7882}/udp"
    # 1GB 机器与机场共存:硬上限,防止内存泄漏把 xray 挤爆触发 OOM killer。
    # 只用 mem_limit,不要同时写 deploy.resources.limits.memory ——
    # 两者取值不同时 compose 会直接报错拒绝加载。
    mem_limit: ${LARES_MEM_LIVEKIT:-256m}
    mem_reservation: 64m
    # 不设 healthcheck:该镜像不保证有 wget/curl,探针失败会把容器误判为 unhealthy。
    # LiveKit 的存活由 deploy.sh 在宿主侧探测(GET / 期望 200,陈旧时为 406)。

  # ── lares-server:presence 信令 + LiveKit token 签发 + 语音便签 ────────────
  lares-server:
    build:
      context: ../server
      dockerfile: Dockerfile
    image: lares-server:local
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    environment:
      LARES_PORT: "8787"
      # 下发给客户端的 LiveKit 地址:必须是浏览器能直连的公网地址(含非标端口)
      LIVEKIT_URL: ${LIVEKIT_PUBLIC_URL:?LIVEKIT_PUBLIC_URL 未设置:形如 wss://rtc.example.com:8444}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY 未设置:openssl rand -hex 16}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET 未设置:openssl rand -hex 32}
      # 服务端调 LiveKit 管理 API(圈主踢人/换口令/解散时把人移出媒体房)走容器内网直连,
      # 不绕公网 wss + Caddy。失败只记日志,不影响信令侧的驱逐。
      LIVEKIT_API_URL: http://livekit:7880
      LARES_DATA_DIR: /app/data

      # ── 鉴权(公网部署绝不能是 none)────────────────────────────────────
      # 取值:none | token | circle | "token,circle"。
      # 用 :? 强制必须显式赋值 —— 忘了填 .env 就直接起不来,而不是裸奔上公网。
      # compose 无法做条件判断,「声明了 token 却没给密钥」这类组合校验由三层兜底:
      #   1) preflight.sh 事前拦截  2) deploy.sh 二次确认
      #   3) lares-server 的 validateAuthConfig() 启动即 exit 1(失败关闭)
      LARES_AUTH_MODE: ${LARES_AUTH_MODE:?LARES_AUTH_MODE 未设置:公网部署请填 token 或 circle,切勿填 none}
      LARES_AUTH_TOKEN: ${LARES_AUTH_TOKEN:-}
      LARES_CIRCLE_PASSCODE: ${LARES_CIRCLE_PASSCODE:-}
      LARES_CIRCLE_PASSCODES: ${LARES_CIRCLE_PASSCODES:-}
      # Web 客户端的同源限制。留空 = 回显 *(仅本地联调用)
      LARES_ALLOWED_ORIGIN: ${LARES_ALLOWED_ORIGIN:-}
      LARES_AUTH_NONCE_TTL_MS: ${LARES_AUTH_NONCE_TTL_MS:-60000}
      # 客户端自建圈:每 IP 每小时最多注册几个(0 = 关闭自助注册),全站总量上限
      LARES_CIRCLE_CREATE_PER_HOUR: ${LARES_CIRCLE_CREATE_PER_HOUR:-5}
      LARES_MAX_CIRCLES: ${LARES_MAX_CIRCLES:-500}
      # 真实客户端 IP:auto = 对端是内网/回环(即 Caddy)时取 X-Forwarded-For 最右一项
      LARES_TRUST_PROXY: ${LARES_TRUST_PROXY:-auto}
    volumes:
      - lares-data:/app/data
    # 不发布到宿主:只经 Caddy 从 docker 内网反代,少一个对公网暴露面
    expose:
      - "8787"
    mem_limit: ${LARES_MEM_SERVER:-128m}
    mem_reservation: 32m
    healthcheck:
      # 镜像是 node:22-alpine,node 一定在;不依赖 curl/wget
      test:
        - CMD-SHELL
        - >-
          node -e "require('http').get('http://127.0.0.1:8787/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      livekit:
        condition: service_started

  # ── Caddy:TLS 终结 + 反代 ────────────────────────────────────────────────
  caddy:
    # 默认官方镜像(够用于 file / selfsigned 模式)。
    # LARES_TLS_MODE=dns 需要带 DNS 插件的自建镜像:
    #   ./caddy/build-caddy.sh  然后在 .env 设 LARES_CADDY_IMAGE=lares-caddy:dns
    image: ${LARES_CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    volumes:
      # 单一开关:LARES_TLS_MODE ∈ {http, dns, file, selfsigned} 决定挂哪份 Caddyfile。
      #
      #   http       独占 80/443 的机器(Lares 专用 VPS)用这个,最省事:
      #              官方镜像直接能用,不要 DNS token。⚠️ 机器上跑着机场时不可用。
      #   dns        不碰任何入站端口,但要 Cloudflare token + 自建带插件的镜像。
      #              与机场共存的机器只能用这个。
      # 用「换文件」而不是「在 Caddyfile 里写条件」——Caddyfile 没有条件语法。
      # 改完 Caddyfile 请用 `docker compose up -d --force-recreate caddy` 生效
      #(单文件挂载 + caddy reload 有 inode 陷阱,重建容器最稳)。
      - ./caddy/Caddyfile.${LARES_TLS_MODE:-dns}:/etc/caddy/Caddyfile:ro
      # 三种模式共用的路由片段(Caddyfile 里 `import routes.caddyfile`,
      # 相对路径按 Caddyfile 所在目录解析,所以必须落在 /etc/caddy/ 下)
      - ./caddy/routes.caddyfile:/etc/caddy/routes.caddyfile:ro
      # 证书持久化:ACME 有速率限制,丢了很麻烦。这不是缓存,必须是持久卷。
      - caddy-data:/data
      - caddy-config:/config
      # file 模式:把自备证书目录挂进来(其它模式下该目录可以是空的)
      - ${LARES_CERT_DIR:-./certs}:/certs:ro
    environment:
      # {$VAR} 在 Caddyfile 里是解析前的文本替换,可用于站点地址;
      # 密钥则用 {env.VAR} 运行时读取,避免落进 adapt 出来的 JSON。
      LARES_DOMAIN: ${LARES_DOMAIN:?LARES_DOMAIN 未设置:还没域名就先用 LARES_TLS_MODE=selfsigned 并填服务器公网 IP}
      LARES_HTTPS_PORT: ${LARES_HTTPS_PORT:-8444}
      LARES_ACME_EMAIL: ${LARES_ACME_EMAIL:-}
      # ACME 目录。默认正式环境;首次部署建议先在 .env 里换成 staging 验证链路。
      # 给默认值而不是留空 —— Caddy 的 acme_ca 拿到空串会解析失败。
      LARES_ACME_CA: ${LARES_ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
      # DNS-01 用:Cloudflare API Token(需 Zone.Zone:Read + Zone.DNS:Edit)
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      # file 模式用:证书/私钥在容器内的路径
      LARES_CERT_FILE: ${LARES_CERT_FILE:-/certs/fullchain.pem}
      LARES_KEY_FILE: ${LARES_KEY_FILE:-/certs/privkey.pem}
    ports:
      # ⚠️ 宿主端口与容器端口必须一致,否则 Caddy 签发/重定向的端口对不上。
      #
      # 与机场共存的机器(LARES_TLS_MODE=dns):保持默认 8444,
      #   **绝不能**出现 "443:443" 或 "80:80" —— 那会抢走 Reality 入站。
      #
      # Lares 专用机器(LARES_TLS_MODE=http):在 .env 里设
      #   LARES_HTTPS_PORT=443
      #   LARES_HTTP_PORT=80
      # HTTP-01 验证走 80,所以那个端口也得发布出来。
      - "${LARES_HTTPS_PORT:-8444}:${LARES_HTTPS_PORT:-8444}/tcp"
      # 默认值刻意设成 8080 而不是 80:忘了配也不会误抢机场的 80。
      - "${LARES_HTTP_PORT:-8080}:${LARES_HTTP_PORT:-8080}/tcp"
    mem_limit: ${LARES_MEM_CADDY:-96m}
    mem_reservation: 24m
    depends_on:
      - lares-server
      - livekit

configs:
  livekit_config:
    # ⚠️ compose 会对 content: 做变量插值(整份 YAML 都会过一遍 Interpolate)。
    #    因此这里若需要字面量 $,必须写成 $$。当前内容不含字面 $,无需转义。
    content: |
      port: 7880
      bind_addresses: ["0.0.0.0"]
      logging:
        # 用 logging.level;顶层 log_level 已废弃且会反过来覆盖这里,不要同时写
        level: ${LARES_LIVEKIT_LOG_LEVEL:-info}
      keys:
        ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
      rtc:
        # ICE/TCP 兜底:UDP 被墙/被 QoS 时客户端自动回落到这里
        tcp_port: ${LARES_RTC_TCP_PORT:-7881}
        # ── UDP 单端口复用(mux)──────────────────────────────────────────
        # ⚠️ 源码 webrtc_config.go 的判定顺序是「先看端口段,端口段没设才用 mux」,
        #    与官方 ports-firewall 文档写反了。所以要用 mux 就**绝不能**出现
        #    port_range_start / port_range_end,否则 udp_port 会被静默忽略。
        # 官方建议 mux 端口数 ≥ vCPU 数;这台机器 1 vCPU,1 个端口即最优。
        udp_port: ${LARES_RTC_UDP_PORT:-7882}
        # 默认值其实是 false;NAT 机器不开就会把内网 IP 当候选地址发给客户端
        use_external_ip: ${LARES_RTC_USE_EXTERNAL_IP:-true}
      turn:
        # 默认关闭:开 TURN 要额外证书和端口,而 UDP mux + ICE/TCP 已覆盖绝大多数 NAT。
        # 若要启用,见 README「TURN」一节(需 external_tls 与证书的取舍)。
        enabled: ${LARES_TURN_ENABLED:-false}
      room:
        # 语音场景:只允许 opus,省 CPU 也防止有人误推视频吃满带宽
        enabled_codecs:
          - mime: audio/opus
        empty_timeout: 300
        departure_timeout: 20
        max_participants: ${LARES_MAX_PARTICIPANTS:-20}
      limit:
        # 1 vCPU:给 track 数一个硬顶,防止异常客户端把 CPU 打满连累 xray
        num_tracks: ${LARES_LIMIT_TRACKS:-100}

volumes:
  lares-data:
  caddy-data:
  caddy-config:
