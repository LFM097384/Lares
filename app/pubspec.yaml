name: lares_app
description: "一键进圈 — 小圈子常驻语音空间"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # RTC:LiveKit 官方 Flutter SDK(iOS/Android/Windows/macOS 全平台)
  livekit_client: ^2.5.0
  # presence 信令
  web_socket_channel: ^3.0.3
  # 桌面托盘入口(macOS 菜单栏 / Windows 托盘)
  tray_manager: ^0.5.2
  # 桌面无边框窗口 / 自绘标题栏
  window_manager: ^0.5.1
  # 本地持久化(userId / 昵称 / deviceId)
  shared_preferences: ^2.3.0
  # Android 前台服务:进房期间保活(§8.3-P1,浸泡测试抓到的掉线问题)
  flutter_foreground_task: ^11.0.3
  # 主屏幕 Widget(iOS WidgetKit / Android App Widget)
  # 锁 0.7.x:0.8 依赖 glance 1.3.0-alpha 需要 compileSdk 37(未发布)
  home_widget: ^0.7.0
  # 语音便签:录音 + 播放 + HTTP
  # 播放用 media_kit(预编译二进制,VS2019 可构建;audioplayers 需 VS2022)
  record: ^6.1.0
  media_kit: ^1.2.6
  media_kit_libs_audio: ^1.0.7
  http: ^1.2.0
  # 网络类型检测(仅 WiFi 下高音质)
  connectivity_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
