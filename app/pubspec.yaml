name: lares_app
description: "Lares 炉灵 — 宅火的守护神，随人而动;小圈子常驻语音空间"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # RTC:LiveKit 官方 Flutter SDK(iOS/Android/Windows/macOS 全平台)
  livekit_client: ^2.5.0
  # presence 信令
  web_socket_channel: ^3.0.3
  # 桌面托盘入口(macOS 菜单栏 / Windows 托盘)
  tray_manager: ^0.5.2
  # 桌面无边框窗口 / 自绘标题栏
  window_manager: ^0.5.1
  # 本地持久化(userId / 昵称 / deviceId)
  shared_preferences: ^2.3.0
  # Android 前台服务:进房期间保活(§8.3-P1,浸泡测试抓到的掉线问题)
  flutter_foreground_task: ^11.0.3
  # 主屏幕 Widget(iOS WidgetKit / Android App Widget)
  # 锁 0.7.x:0.8 依赖 glance 1.3.0-alpha 需要 compileSdk 37(未发布)
  home_widget: ^0.7.0
  # 语音便签:录音 + 播放 + HTTP
  # 播放用 media_kit(预编译二进制,VS2019 可构建;audioplayers 需 VS2022)
  record: ^6.1.0
  media_kit: ^1.2.6
  media_kit_libs_audio: ^1.0.7
  http: ^1.2.0
  # 网络类型检测(仅 WiFi 下高音质)
  connectivity_plus: ^7.0.0
  # ── 自动更新(lib/src/update/)──
  # 读取运行中 App 的版本号做版本比对。此前仅由 livekit_client 间接引入,
  # 直接依赖它才稳妥(传递依赖随时可能被上游移除)。版本对齐 pubspec.lock。
  package_info_plus: ^10.2.1
  # 更新包下载落盘目录(临时目录 / 应用支持目录)
  path_provider: ^2.1.6
  # Android 取设备真实 ABI(Build.SUPPORTED_ABIS),用于挑选 split-per-abi APK
  device_info_plus: ^13.2.0
  # 下载完整性:SHA-256 摘要
  crypto: ^3.0.7
  # 本地离线语音识别(sherpa-onnx / next-gen Kaldi,预编译 DLL,VS2019 可构建)
  sherpa_onnx: ^1.13.8
  # 选图(lib/src/chat/image_source*.dart):系统文件对话框,桌面 + Web 均支持。
  # 选它而非 image_picker:桌面是当前主力端,且它不需要运行时权限申请。
  # 移动端将来若要相册/相机双入口,再叠加 image_picker(接缝已留好)。
  file_selector: ^1.0.3
  # 位置共享(Snapchat 式):GPS + 开源地图(免 API key)
  geolocator: ^14.0.0
  flutter_map: ^8.2.0
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
