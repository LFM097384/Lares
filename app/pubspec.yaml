name: lares_app
description: "Lares 炉灵 — 宅火的守护神，随人而动;小圈子常驻语音空间"
publish_to: "none"
version: 0.1.1+2

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # RTC:LiveKit 官方 Flutter SDK(iOS/Android/Windows/macOS 全平台)
  livekit_client: ^2.5.0
  # presence 信令
  web_socket_channel: ^3.0.3
  # 桌面托盘入口(macOS 菜单栏 / Windows 托盘)
  tray_manager: ^0.5.2
  # 桌面无边框窗口 / 自绘标题栏
  window_manager: ^0.5.1
  # 本地持久化(userId / 昵称 / deviceId)
  shared_preferences: ^2.3.0
  # Android 前台服务:进房期间保活(§8.3-P1,浸泡测试抓到的掉线问题)
  flutter_foreground_task: ^11.0.3
  # 主屏幕 Widget(iOS WidgetKit / Android App Widget)
  # 锁 0.7.x:0.8 依赖 glance 1.3.0-alpha 需要 compileSdk 37(未发布)
  home_widget: ^0.7.0
  # 语音便签:录音 + 播放 + HTTP
  # 播放用 media_kit(预编译二进制,VS2019 可构建;audioplayers 需 VS2022)
  record: ^6.1.0
  media_kit: ^1.2.6
  media_kit_libs_audio: ^1.0.7
  http: ^1.2.0
  # 网络类型检测(仅 WiFi 下高音质)
  connectivity_plus: ^7.0.0
  # ── 自动更新(lib/src/update/)──
  # 读取运行中 App 的版本号做版本比对。此前仅由 livekit_client 间接引入,
  # 直接依赖它才稳妥(传递依赖随时可能被上游移除)。版本对齐 pubspec.lock。
  package_info_plus: ^10.2.1
  # 更新包下载落盘目录(临时目录 / 应用支持目录)
  path_provider: ^2.1.6
  # Android 取设备真实 ABI(Build.SUPPORTED_ABIS),用于挑选 split-per-abi APK
  device_info_plus: ^13.2.0
  # 下载完整性:SHA-256 摘要
  crypto: ^3.0.7
  # ⚠️ sherpa_onnx(本地离线语音识别)已**暂时移除**,连同 stt_sherpa.dart 与
  # 它的测试一起挪到 app/_disabled/recording_stt/(见该目录 README 的恢复步骤)。
  # 原因:录音功能当前不开放(LaresConfig.recordingEnabled 默认 false),而
  # Dart 的 tree-shaking **对原生库完全无效** —— 实测默认构建仍会分发
  # onnxruntime.dll(17MB)+ sherpa-onnx-c-api.dll(4.4MB)。iOS 上这会是
  # 一个 .xcframework 被无条件打进 app bundle:白白增加 22MB 下载量,
  # 且让一个「语音房」App 里带着完整离线语音识别引擎,对 App Store 审核
  # 的 2.3.1(hidden/dormant features)是不利叙事。
  # 恢复录音功能时,把依赖加回这里,并把 _disabled/ 里的两个文件挪回原位。
  # 选图(lib/src/chat/image_source*.dart):系统文件对话框,桌面 + Web 均支持。
  # 选它而非 image_picker:桌面是当前主力端,且它不需要运行时权限申请。
  # 移动端将来若要相册/相机双入口,再叠加 image_picker(接缝已留好)。
  file_selector: ^1.0.3
  # 位置共享(Snapchat 式):GPS + 开源地图(免 API key)
  geolocator: ^14.0.0
  flutter_map: ^8.2.0
  latlong2: ^0.9.1
  # 把 URL 交给系统打开。两处用途,都是 App Store 上架的硬需求:
  #  1. 举报走 `mailto:` 直接拉起邮件 App(Guideline 1.2 要求举报通道可用);
  #  2. App 内打开隐私政策 / 服务条款的网页链接(ASC 必填项,且必须在 App 内可达)。
  url_launcher: ^6.3.2
  hashlib: ^2.4.2
  flutter_secure_storage: ^11.1.1
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
